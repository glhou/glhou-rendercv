cv:
  name: Glenn Louedec
  headline: Fullstack Python Engineer
  location: Kawasaki, JP
  email: g.louedec@live.fr
  photo:
  phone:
  website:
  social_networks:
    - network: LinkedIn
      username: glenn-louedec
    - network: GitHub
      username: Glhou
  custom_connections:
  sections:
    summary:
      - Software engineer based in Tokyo with experience in Python/Flask backend development, API integrations, and production systems. Currently expanding expertise in DevOps, cloud infrastructure, automation, and scalable backend solutions. Holds a Master’s in Engineering from Keio University and Centrale Marseille.
    education:
      - institution: Keio University
        area: Computer Engineering
        degree: MS
        date:
        start_date: 2022-09
        end_date: 2024-09
        location: Yokohama, JP
        summary: Master of Science in Engineering
        highlights:
          - Double degree at Keio University
          - Master thesis on a taxi carpooling system designed to reduce the number of vehicles in cities. Successfullydemonstrated a 30% reduction in vehicle usage through the implementation of my proposed method.
      - institution: École Centrale Méditerrannée
        area: Engineering
        degree: MS
        date:
        start_date: 2020-09
        end_date: 2024-09
        location: Marseille, France
        summary: Engineering Diploma (Master equivalent)
        highlights:
          - 'Activities and societies: GInfo (IT club), MDV (Sailing club)'
          - General engineering & managment with specialization in computer sciences.
          - 'Chosen curriculum: MIE (Devweb, Database), C++ object oriented programming, Front-end web development,AI and Games.'
    experience:
      - company: BHJ Soft Corporation
        position: Fullstack Software Engineer
        date:
        start_date: 2025-04
        end_date: 2026-06
        location: Ebina, JP
        summary:
        highlights:
          - Built Terraform IaC from scratch to deploy and manage AWS infrastructure.
          - Developed and maintained ETL pipelines and backend services in Python/Flask.
          - Integrated and maintained external carrier APIs and marketplaces (DHL,UPS, Japan Post, FedEx, Shopify, eBay). Improved scalability and reliability by refactoring core components and legacy code.
          - Automated deployment workflows using GitHub Actions and Heroku/AWS pipelines.
          - Participated in code reviews and implemented best practices for maintain ablebackend systems.
      - company: Nalyze
        position: Intern
        date:
        start_date: 2022-06
        end_date: 2022-08
        location: Nantes, France
        summary:
        highlights:
          - Developed a Python web app to fetch and integrate GitHub data, reducingdata retrieval from 30–60 minutes to a few minutes.
    skills:
      - label: Languages
        details: Python, Go, PHP, JS/TS
      - label: ML Frameworks
        details: Flask, Symfony, React
      - label: Infrastructure
        details: Docker, AWS, Terraform, GitHub Actions
      - label: Spoken Languages
        details: English (TOEIC 970), Japanese (JLPT N3), French (Natif)
      - label: Soft Skills
        details: Design and planning features, Agile workflow
